name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps to match the Dockerfile + deploy install: the lock
        # is generated this way (peer deps like livekit-client's
        # @types/dom-mediacapture-record aren't materialized), so a plain
        # `npm ci` would reject it as out of sync.
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit --pretty
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'file:./prisma/dev.db'
          TMDB_API_KEY: 'ci-placeholder'
          TMDB_READ_ACCESS_TOKEN: 'ci-placeholder'
          TMDB_BASE_URL: 'https://api.themoviedb.org/3'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
          NEXT_PUBLIC_TMDB_IMAGE_BASE_URL: 'https://image.tmdb.org/t/p'
          NEXT_PUBLIC_REGION: 'VN'

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check README updates
        run: |
          # Get changed files in this PR
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || echo "")

          # Check if important dirs changed
          IMPORTANT_CHANGES=$(echo "$CHANGED_FILES" | grep -E "^(app/|src/server/|lib/|server/|prisma/schema|hooks/|services/|types/|scripts/|middleware\.ts|server\.ts|next\.config|\.env\.example|package\.json)" || true)

          # Check if README changed
          README_CHANGED=$(echo "$CHANGED_FILES" | grep "^README.md$" || true)

          if [ -n "$IMPORTANT_CHANGES" ] && [ -z "$README_CHANGED" ]; then
            echo "⚠️  CẢNH BÁO: Có thay đổi code quan trọng nhưng README.md chưa cập nhật!"
            echo ""
            echo "File thay đổi quan trọng:"
            echo "$IMPORTANT_CHANGES" | head -20
            echo ""
            echo "Hãy kiểm tra xem README.md có cần cập nhật không."
            echo "Xem luật: README.md → Mục 11 (LUẬT BẮT BUỘC CẬP NHẬT README)"
            # Warning only, not blocking
            exit 0
          else
            echo "✅ README check passed."
          fi
