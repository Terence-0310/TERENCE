name: CI

on:
  push:
    # deploy/render is the branch Render deploys (render.yaml).
    branches: [main, deploy/render]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN in every job below.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned gitleaks image (no third-party action). Scans the current tree
      # plus the commits this push / PR introduces. Older history contains
      # already-reported leaks (docs/security-audit/GITHUB_HISTORY_AUDIT.md),
      # so it is not rescanned on every run.
      - name: Gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          IMG=zricethezav/gitleaks:v8.28.0
          docker run --rm -v "$PWD:/repo" -w /repo "$IMG" dir . --config .gitleaks.toml --redact --no-banner
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            RANGE="$BASE..$GITHUB_SHA"
          else
            RANGE="-1"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh "$IMG" -c \
            "git config --global --add safe.directory /repo && gitleaks git . --log-opts='$RANGE' --config .gitleaks.toml --redact --no-banner"

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps to match the Dockerfile + deploy install: the lock
        # is generated this way (peer deps like livekit-client's
        # @types/dom-mediacapture-record aren't materialized), so a plain
        # `npm ci` would reject it as out of sync.
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit --pretty

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          NEXTAUTH_SECRET: 'ci-placeholder-secret'
          TMDB_API_KEY: 'ci-placeholder'
          TMDB_READ_ACCESS_TOKEN: 'ci-placeholder'
          TMDB_BASE_URL: 'https://api.themoviedb.org/3'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
          NEXT_PUBLIC_TMDB_IMAGE_BASE_URL: 'https://image.tmdb.org/t/p'
          NEXT_PUBLIC_REGION: 'VN'

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check README updates
        run: |
          # Get changed files in this PR
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || echo "")

          # Check if important dirs changed
          IMPORTANT_CHANGES=$(echo "$CHANGED_FILES" | grep -E "^(app/api/|src/be/|src/dta/prisma/schema\.prisma|src/constants/|lib/env\.ts|proxy\.ts|server\.ts|next\.config|package\.json)" || true)

          # Check if README changed
          README_CHANGED=$(echo "$CHANGED_FILES" | grep "^README.md$" || true)

          if [ -n "$IMPORTANT_CHANGES" ] && [ -z "$README_CHANGED" ]; then
            echo "⚠️  CẢNH BÁO: Có thay đổi code quan trọng nhưng README.md chưa cập nhật!"
            echo ""
            echo "File thay đổi quan trọng:"
            echo "$IMPORTANT_CHANGES" | head -20
            echo ""
            echo "Hãy kiểm tra xem README.md có cần cập nhật không."
            # Warning only, not blocking
            exit 0
          else
            echo "✅ README check passed."
          fi
