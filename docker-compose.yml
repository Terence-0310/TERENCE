# ============================================
# TERENCE — Docker Compose (Local Development)
# ============================================
# Usage:
#   docker compose up --build        (build + start)
#   docker compose up -d             (detached mode)
#   docker compose down              (stop all)
#   docker compose exec app npx prisma migrate deploy   (run migrations)
#   docker compose exec app npx prisma db seed          (seed data)
#   docker compose logs -f app       (follow app logs)
# ============================================

services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    container_name: terence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terence_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terence_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Elasticsearch (Local Search) ──
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: terence-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis (Local Cache) ──
  redis:
    image: redis:7-alpine
    container_name: terence-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Next.js Application ──
  app:
    container_name: terence-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
        NEXT_PUBLIC_REGION: VN
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # PostgreSQL — connects to 'db' service via Docker network
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/terence_dev?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/terence_dev?schema=public
      # TMDB API (override via .env for real keys)
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN:-}
      - TMDB_BASE_URL=https://api.themoviedb.org/3
      - TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/original
      # Site
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - NEXT_PUBLIC_TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p
      - NEXT_PUBLIC_REGION=VN
      - NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
      # OPhim
      - OPHIM_BASE_URL=https://ophim1.com
      - OPHIM_TIMEOUT=15000
      - OPHIM18_BASE_URL=https://ophim1.com
      - OPHIM18_TIMEOUT=20000
      - DISABLE_OPHIM_CHECK=${DISABLE_OPHIM_CHECK:-true}
      # Live catalog source. Use only where the provider's content license permits.
      - KKPHIM_BASE_URL=${KKPHIM_BASE_URL:-https://phimapi.com}
      - KKPHIM_TIMEOUT=${KKPHIM_TIMEOUT:-20000}
      # Player
      - DEMO_HLS_URL=https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
      - PUBLIC_STREAM_ALLOWED_HOSTS=test-streams.mux.dev,devstreaming-cdn.apple.com
      - NEXT_PUBLIC_ENABLE_RESUME=true
      - NEXT_PUBLIC_ENABLE_SUBTITLES=true
      # Elasticsearch API (Local Docker override)
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX_MOVIES=terence_movies
      - ELASTICSEARCH_USERNAME=
      - ELASTICSEARCH_PASSWORD=
      - ELASTICSEARCH_API_KEY=
      # Redis Cache
      - REDIS_URL=redis://redis:6379
      # NextAuth — override localhost values from .env
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # No default: a well-known fallback secret would let anyone forge sessions.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env (openssl rand -hex 32)}
      # Socket.IO CORS — comma-separated. server.ts reads this; without it
      # production builds reject cross-origin WS handshakes.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # News auto-generation (Gemini). Free key at https://aistudio.google.com/apikey
      # Email: SMTP_HOST/PORT from .env (e.g. smtp.gmail.com:465). Unset →
      # the Mailpit container (inbox UI: http://localhost:8025).
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GNEWS_API_KEY=${GNEWS_API_KEY:-}
      # Seeding is opt-in: set SEED_ON_START=true for the first start only.
      # Seed is create-only (never overwrites existing users); demo account
      # passwords come from SEED_*_PASSWORD (random if unset in production).
      - SEED_ON_START=${SEED_ON_START:-false}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD:-}
      - SEED_STAFF_PASSWORD=${SEED_STAFF_PASSWORD:-}
      # Auto-sync OPhim catalog on first start so the DB has real playable
      # movies (URL slugs like /watch/hoppers-cu-nhay-ky-dieu work out of
      # the box). Toggle off (false) after first successful run to avoid
      # re-fetching every container restart.
      - SYNC_OPHIM_ON_START=${SYNC_OPHIM_ON_START:-false}
      - OPHIM_SYNC_PAGES=${OPHIM_SYNC_PAGES:-3}
      - SYNC_KKPHIM_ON_START=${SYNC_KKPHIM_ON_START:-true}
      - KKPHIM_SYNC_PAGES=${KKPHIM_SYNC_PAGES:-3}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Mail catcher (dev / demo) ──
  # Receives every email the app sends. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: terence-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # ── Database UI (Prisma Studio) — optional: docker compose --profile tools up -d ──
  db-studio:
    profiles: ["tools"]
    image: node:20-alpine
    container_name: terence-db-studio
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./src/dta/prisma:/app/prisma
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/terence_dev?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/terence_dev?schema=public
    ports:
      - "5556:5555"
    command: >
      sh -c "npx prisma@6 generate --schema=prisma/schema.prisma && npx prisma@6 studio --schema=prisma/schema.prisma --port 5555 --browser none"
    depends_on:
      db:
        condition: service_healthy

  # ── pgAdmin (PostgreSQL Database UI) ──
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4
    container_name: terence-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@terence.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  es_data:
    driver: local
