# ================================================
# terence.com.vn — Nginx Reverse Proxy
# Optimized for Cloudflare proxy (SSL terminated at CF)
# ================================================
# Copy to: /etc/nginx/sites-available/terence
# Enable:  ln -s /etc/nginx/sites-available/terence /etc/nginx/sites-enabled/

# Redirect www → non-www
server {
    listen 80;
    listen [::]:80;
    server_name www.terence.com.vn;
    return 301 $scheme://terence.com.vn$request_uri;
}

# Main app
server {
    listen 80;
    listen [::]:80;
    server_name terence.com.vn;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Limits ──
    client_max_body_size 10M;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;

    # ── Next.js static assets — immutable cache ──
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Public static files ──
    location ~* \.(ico|png|svg|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ── All requests → Next.js ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward real client info (Cloudflare passes CF-Connecting-IP)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # No cache for dynamic content
        proxy_cache_bypass $http_upgrade;
    }
}
