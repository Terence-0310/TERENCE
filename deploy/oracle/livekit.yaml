# ============================================
# TERENCE — LiveKit SFU config (docker-compose.prod.yml)
# ============================================
# API key/secret are NOT here: they come from the LIVEKIT_KEYS env var
# (built from LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.production).
# Signalling (7880) is reached via Caddy at wss://LIVEKIT_DOMAIN (TLS there).
# Media: open 7881/tcp and 7882/udp in the OCI Security List / NSG.
# ============================================

port: 7880

rtc:
  tcp_port: 7881
  # Single-port UDP mux — one port to open instead of a 50000-60000 range.
  udp_port: 7882
  # OCI gives the VM a private IP behind 1:1 NAT; discover the public IP via STUN
  # so ICE candidates advertise an address clients can reach.
  use_external_ip: true

room:
  empty_timeout: 300
  max_participants: 20

logging:
  level: info
  json: true

# Optional TURN/UDP relay for networks that block direct UDP/TCP media.
# 1) uncomment below, 2) uncomment "3478:3478/udp" in docker-compose.prod.yml,
# 3) open 3478/udp in the OCI Security List. TURN/TLS (5349) additionally needs
# certificate files and is not configured here.
# turn:
#   enabled: true
#   udp_port: 3478
#   domain: livekit.example.com   # = LIVEKIT_DOMAIN
