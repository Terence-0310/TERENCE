<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HLS proxy test — Terence</title>
<style>
  body { margin: 0; background: #0a0a0a; color: #fff; font: 14px system-ui; padding: 20px; }
  video { width: 100%; max-width: 960px; background: #000; }
  pre { white-space: pre-wrap; background: #1a1a1a; padding: 12px; border-radius: 8px; max-height: 320px; overflow: auto; font: 12px Consolas, monospace; }
  h1 { margin: 0 0 12px; }
  .row { margin: 12px 0; }
  button { padding: 8px 14px; background: #16a34a; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
  <h1>HLS proxy test</h1>
  <div class="row">URL goc: <code id="src">https://vip.opstream90.com/20260411/29258_391177aa/index.m3u8</code></div>
  <video id="v" controls muted playsinline autoplay></video>
  <div class="row"><button id="play">Bam Play (neu autoplay bi chan)</button></div>
  <h3>Log:</h3>
  <pre id="log"></pre>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script>
    const logEl = document.getElementById('log')
    const log = (...a) => { logEl.textContent += a.join(' ') + '\n'; console.log(...a) }
    const video = document.getElementById('v')
    const upstream = document.getElementById('src').textContent.trim()
    const proxied = '/api/hls-proxy?u=' + encodeURIComponent(upstream)
    log('Loading:', proxied)

    if (Hls.isSupported()) {
      const hls = new Hls({ debug: false, enableWorker: false, defaultAudioCodec: 'mp4a.40.2' })
      hls.on(Hls.Events.MANIFEST_PARSED, (_e, d) => log('MANIFEST_PARSED levels:', d.levels.length))
      hls.on(Hls.Events.LEVEL_LOADED, (_e, d) => log('LEVEL_LOADED totalduration:', d.details?.totalduration))
      hls.on(Hls.Events.FRAG_LOADED, (_e, d) => log('FRAG_LOADED sn:', d.frag?.sn))
      hls.on(Hls.Events.ERROR, (_e, d) => log('ERROR', d.type, d.details, 'fatal:', d.fatal, JSON.stringify(d.response || {}).slice(0, 200)))
      hls.loadSource(proxied)
      hls.attachMedia(video)
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxied
      log('Using native HLS (Safari)')
    } else {
      log('NO HLS SUPPORT in this browser')
    }
    document.getElementById('play').onclick = () => video.play()
  </script>
</body>
</html>
