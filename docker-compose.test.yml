# ============================================
# TERENCE — Docker Compose (Local Testing)
# ============================================
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
# ============================================

services:
  db-test:
    image: postgres:16-alpine
    container_name: terence-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terence_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terence_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: terence-test-runner
    # We use an anonymous volume for node_modules so it doesn't overwrite local ones
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@db-test:5432/terence_test?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@db-test:5432/terence_test?schema=public
    command: sh -c "npx prisma generate && npm run test"
    depends_on:
      db-test:
        condition: service_healthy
