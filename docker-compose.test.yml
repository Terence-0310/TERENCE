# ============================================
# TERENCE — Docker Compose (Local Testing)
# ============================================
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
# ============================================

services:
  db-test:
    image: postgres:16-alpine
    container_name: terence-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terence_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terence_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch-test:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: terence-test-es
    environment:
      - node.name=terence-test-es
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: terence-test-runner
    # We use an anonymous volume for node_modules so it doesn't overwrite local ones
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@db-test:5432/terence_test?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@db-test:5432/terence_test?schema=public
      - ELASTICSEARCH_HOST=http://elasticsearch-test:9200
      - ELASTICSEARCH_API_KEY=
    # Generate the client, then sync the schema into the throwaway test DB via
    # `db push` (the project's standard path — `prisma migrate` is unusable
    # because the legacy migrations were authored for SQLite). This materialises
    # every table/column, incl. the TCoin perk fields, so DB-backed integration
    # tests run against an up-to-date schema.
    command: sh -c "npx prisma generate && npx prisma db push --schema=src/dta/prisma/schema.prisma --skip-generate --accept-data-loss && npm run test"
    depends_on:
      db-test:
        condition: service_healthy
      elasticsearch-test:
        condition: service_healthy
